<!doctype html>
<!--[if lt IE 7]><html class="no-js lt-ie9 lt-ie8 lt-ie7" lang="en"> <![endif]-->
<!--[if (IE 7)&!(IEMobile)]><html class="no-js lt-ie9 lt-ie8" lang="en"><![endif]-->
<!--[if (IE 8)&!(IEMobile)]><html class="no-js lt-ie9" lang="en"><![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="en"><!--<![endif]-->

<head>
{% include head.html %}

<script src="https://cdn.counter.dev/script.js" data-id="4c8f7caa-2b55-46cd-a995-2c4633303773" data-utcoffset="8"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N5JY1E21"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-T5N5JY1E21');
</script>

</head>


<body class="page" itemscope itemtype="http://schema.org/WebPage">

<div class="page-wrapper">

{% include chrome-frame.html %}

{% include navigation.html %}

{% if page.image.feature %}<div class="image-wrap">
  <img src="{{ site.url }}/images/{{ page.image.feature }}" alt="{{ page.title }} feature image" itemprop="primaryImageOfPage">
</div><!-- /.image-wrap -->{% endif %}

<div id="main" role="main"  itemprop="mainContentOfPage">
  <div class="article-author-top">
    {% include author-bio.html %}
  </div><!-- /.article-author-top -->

  <!-- ScrollSpy TOC sidebar (desktop >=600px fixed right) -->
  <div class="toc" id="toc">
    <header><h3>目录</h3></header>
  </div><!-- /#toc -->

  <article itemscope itemtype="http://schema.org/CreativeWork">
  {% comment %}
    <div class="headline-wrap">
      <h1 itemprop="headline">{{ page.title }}</h1>
    </div><!--/ .headline-wrap -->
  {% endcomment %}
    <div class="article-wrap" itemprop="text">
      {{ content }}
    </div><!-- /.article-wrap -->
  </article>
</div><!-- /#index -->

</div><!-- /.page-wrapper -->

<div class="footer-wrap">
  <footer>
    {% include footer.html %}
  </footer>
</div><!-- /.footer-wrap -->

{% include scripts.html %}

<!-- ScrollSpy TOC scrollnav -->
<script src="https://unpkg.com/scrollnav@3.0.1/dist/scrollnav.min.umd.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var ct = document.querySelector(".article-wrap");
    if (!ct) return;
    var hasHeadings = ct.querySelector("h2");
    if (!hasHeadings) return;
    scrollnav.init(ct, { debug: false, easingStyle: "linear", sections: "h2", subSections: "h3" });
    var toc = document.getElementById("toc");
    var nav = document.querySelector(".scroll-nav");
    if (toc && nav) { toc.appendChild(nav); }
  });
</script>

<style>
  #toc header h3 { margin: 0; padding: 5px 10px; color: #fff; font-size: 1em; letter-spacing: 0; }
  #toc header h3:hover { cursor: pointer; }
  #toc .scroll-nav { background: #4d4d4d; padding: 8px 0; max-height: calc(100vh - 200px); overflow-y: auto; }
  #toc .scroll-nav__list, #toc .scroll-nav__sub-list { margin: 0; padding: 0; list-style: none; }
  #toc .scroll-nav__item { margin: 0; list-style: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
  #toc .scroll-nav__item:last-child { border-bottom: none; }
  #toc .scroll-nav__link { display: block; padding: 6px 10px; color: #ccc; text-decoration: none; font-size: 0.85em; line-height: 1.4; }
  #toc .scroll-nav__link:hover, #toc .scroll-nav__item--active > .scroll-nav__link { color: #fff; background: rgba(255,255,255,0.1); }
</style>

</body>
</html>
